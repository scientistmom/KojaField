    <script data-game-loader>
      (function () {
        'use strict';
        function boot() {
          const sources = [...document.querySelectorAll('script[data-game-src]')].map(
              (node) => node.dataset.gameSrc,
            ),
            main = document.getElementById('main');
          let hungarian = false;
          try {
            hungarian = localStorage.getItem('kojagarden.language') === 'hu';
          } catch {}
          const copy = hungarian
              ? {
                  loading: 'Készül a kerted…',
                  failed: 'A kerted nem töltődött be. Próbáld újra!',
                  retry: 'Újra',
                  reopen: 'Nyissuk meg újra a kerted!',
                  reload: 'Újratöltés',
                }
              : {
                  loading: 'Getting your garden ready…',
                  failed: 'Your garden could not load. Try again.',
                  retry: 'Try again',
                  reopen: 'Let’s reopen your garden.',
                  reload: 'Reload',
                },
            notice = document.createElement('div'),
            message = document.createElement('p'),
            retry = document.createElement('button');
          notice.id = 'game-startup-notice';
          notice.dataset.noTranslate = '';
          notice.setAttribute('role', 'status');
          notice.style.cssText =
            'max-width:1208px;margin:20px auto;padding:18px 24px;background:#fffdf1;border:1px solid #c8d4b7;border-radius:14px;color:#233e3a';
          message.style.margin = '0';
          retry.id = 'game-startup-retry';
          retry.type = 'button';
          retry.className = 'button primary';
          retry.style.marginTop = '12px';
          retry.hidden = true;
          notice.append(message, retry);
          if (main) {
            main.before(notice);
            main.inert = true;
            main.setAttribute('aria-busy', 'true');
          } else document.body.prepend(notice);
          let next = 0,
            running = false,
            runtimeFailed = false;
          function showFailure(runtime) {
            runtimeFailed ||= runtime;
            message.textContent = runtimeFailed ? copy.reopen : copy.failed;
            retry.textContent = runtimeFailed ? copy.reload : copy.retry;
            retry.disabled = false;
            retry.hidden = false;
            notice.hidden = false;
          }
          function runtimeError(event) {
            if (event.target === window) showFailure(true);
          }
          window.addEventListener('error', runtimeError);
          async function load(source) {
            for (let attempt = 0; attempt < 3; attempt++) {
              if (attempt)
                await new Promise((resolve) => setTimeout(resolve, attempt === 1 ? 250 : 750));
              if (runtimeFailed) throw new Error('Startup execution failed');
              try {
                await new Promise((resolve, reject) => {
                  const script = document.createElement('script');
                  script.async = false;
                  script.onload = () => {
                    script.onload = script.onerror = null;
                    resolve();
                  };
                  script.onerror = () => {
                    script.onload = script.onerror = null;
                    script.remove();
                    reject({ kind: 'network' });
                  };
                  script.src = source;
                  document.head.append(script);
                });
                return;
              } catch (error) {
                if (error.kind !== 'network' || attempt === 2) throw error;
              }
            }
          }
          async function start() {
            if (running || runtimeFailed) return;
            running = true;
            retry.hidden = true;
            retry.disabled = true;
            message.textContent = copy.loading;
            try {
              while (next < sources.length) {
                await load(sources[next]);
                if (runtimeFailed) throw new Error('Startup execution failed');
                next++;
              }
              // Standalone editions finish their inline DOMContentLoaded callbacks first.
              await new Promise((resolve) => setTimeout(resolve, 0));
              if (runtimeFailed) throw new Error('Startup execution failed');
              document.documentElement.dataset.gameReady = 'true';
              if (main) {
                main.inert = false;
                main.removeAttribute('aria-busy');
              }
              notice.hidden = true;
              window.removeEventListener('error', runtimeError);
            } catch (error) {
              showFailure(runtimeFailed || error.kind !== 'network');
            } finally {
              running = false;
              retry.disabled = false;
            }
          }
          retry.addEventListener('click', () => {
            if (runtimeFailed) location.reload();
            else start();
          });
          start();
        }
        if (document.readyState === 'loading')
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        else boot();
      })();
    </script>

  <body>
    <a class="skip-link" href="#main">Skip to game</a>
    <header class="site-header garden-lesson-header">
      <a class="brand" href="index.html#garden-3" aria-label="All gardens"
        ><span class="brand-symbol" aria-hidden="true">✿</span> KojaField</a
      >
      <nav aria-label="Navigation">
        <a class="nav-link field-link" href="index.html#garden-3" aria-label="All gardens"
          >← Gardens</a
        ><button class="nav-link active" id="g3-map">Map</button>
      </nav>
      <div class="header-right">
        <a
          class="garden-wallet-pill"
          href="index.html#garden-3"
          data-garden-wallet="grade3"
          aria-label="Garden shop"
          ><span class="sr-only">Coins for your garden</span><span data-wallet-balance>0</span></a
        ><button class="icon-button" id="g3-help" aria-label="How to play">?</button>
      </div>
      <label class="language-picker" data-no-translate
        ><span class="sr-only">Language / Nyelv</span
        ><select data-language-switch aria-label="Language / Nyelv">
          <option value="en">EN</option>
          <option value="hu">HU</option>
        </select></label
      >
    </header>
    <main id="main">
      <p id="g3-save-note" class="save-note" role="status" hidden>Cannot save in this browser.</p>
      <section id="g3-map-view">
        <div class="journey-heading">
          <h1>3rd Grade</h1>
          <span id="g3-count" class="field-count">0 / 80</span>
        </div>
        <div class="world-tabs" id="g3-worlds" aria-label="Maths worlds"></div>
        <section class="world-panel" id="g3-world-panel">
          <div class="world-heading">
            <div>
              <span class="world-kicker" id="g3-world-number"></span>
              <h2 id="g3-world-title"></h2>
            </div>
            <button class="review-link" id="g3-review">
              Review <span id="g3-review-count">0</span>
            </button>
          </div>
          <div class="world-map" id="g3-map-field">
            <svg id="g3-path" aria-hidden="true"></svg>
            <div class="g3-stops" id="g3-stops"></div>
          </div>
        </section>
      </section>
      <section id="g3-play-view" hidden>
        <div class="play-top">
          <button class="back-button" id="g3-back">← Map</button
          ><span class="level-skill lesson-location"
            ><span>Grade 3</span> · <span id="g3-play-location"></span></span
          ><button id="g3-refresh" type="button" class="button quiet" hidden>
            Fresh questions
          </button>
        </div>
        <div class="play-heading">
          <h1 id="g3-play-title"></h1>
          <span class="level-skill" id="g3-level-kind"></span>
        </div>
        <div id="g3-missions" class="mission-tabs" hidden></div>
        <details class="learn-panel" id="g3-learn">
          <summary>Show an example</summary>
          <div class="learn-content">
            <h2 id="g3-objective"></h2>
            <p id="g3-explanation"></p>
            <div class="worked-example" id="g3-example"></div>
          </div>
        </details>
        <div class="g3-play-layout">
          <section class="g3-workbook">
            <div class="workbook-heading">
              <p id="g3-instruction">Answer the whole set.</p>
              <span id="g3-answer-count" class="answer-counter"></span>
            </div>
            <h2 id="g3-task-prompt" class="g3-set-prompt" hidden></h2>
            <form id="g3-form" novalidate>
              <div class="g3-question-grid" id="g3-questions"></div>
              <div class="workbook-footer">
                <button id="g3-submit" class="button primary" type="submit">Check my work →</button>
              </div>
            </form>
            <div id="g3-result" class="g3-result" role="status" hidden>
              <h2 id="g3-result-title"></h2>
              <p id="g3-result-copy"></p>
              <div id="g3-reward" class="garden-reward" hidden></div>
              <div id="g3-targeted" class="targeted-actions"></div>
              <details id="g3-mistakes">
                <summary>A checking tip</summary>
                <p id="g3-mistake-copy"></p>
              </details>
              <div class="result-actions">
                <button class="button quiet" id="g3-revise">Review answers</button
                ><button class="button primary" id="g3-next-run">Fresh questions →</button
                ><button class="button quiet" id="g3-result-map">Map</button
                ><button class="button quiet" id="g3-retry-mission" hidden>
                  Retry this mission
                </button>
              </div>
            </div>
          </section>
          <aside class="g3-flower-panel">
            <div class="flower-heading"><span>This set</span><output id="g3-score">—</output></div>
            <div id="g3-flower" aria-label="No result yet"></div>
            <div id="g3-record" class="g3-record"></div>
          </aside>
        </div>
      </section>
    </main>
    <dialog class="info-dialog" id="g3-dialog">
      <button class="icon-button dialog-close" id="g3-close" aria-label="Close">×</button>
      <div id="g3-dialog-copy"></div>
    </dialog>
    <noscript>Enable JavaScript to play.</noscript>
