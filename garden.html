    <script data-game-loader>
      (function () {
        'use strict';
        function boot() {
          const sources = [...document.querySelectorAll('script[data-game-src]')].map(
              (node) => node.dataset.gameSrc,
            ),
            main = document.getElementById('main');
          let hungarian = false;
          try {
            hungarian = localStorage.getItem('kojagarden.language') === 'hu';
          } catch {}
          const copy = hungarian
              ? {
                  loading: 'Készül a kerted…',
                  failed: 'A kerted nem töltődött be. Próbáld újra!',
                  retry: 'Újra',
                  reopen: 'Nyissuk meg újra a kerted!',
                  reload: 'Újratöltés',
                }
              : {
                  loading: 'Getting your garden ready…',
                  failed: 'Your garden could not load. Try again.',
                  retry: 'Try again',
                  reopen: 'Let’s reopen your garden.',
                  reload: 'Reload',
                },
            notice = document.createElement('div'),
            message = document.createElement('p'),
            retry = document.createElement('button');
          notice.id = 'game-startup-notice';
          notice.dataset.noTranslate = '';
          notice.setAttribute('role', 'status');
          notice.style.cssText =
            'max-width:1208px;margin:20px auto;padding:18px 24px;background:#fffdf1;border:1px solid #c8d4b7;border-radius:14px;color:#233e3a';
          message.style.margin = '0';
          retry.id = 'game-startup-retry';
          retry.type = 'button';
          retry.className = 'button primary';
          retry.style.marginTop = '12px';
          retry.hidden = true;
          notice.append(message, retry);
          if (main) {
            main.before(notice);
            main.inert = true;
            main.setAttribute('aria-busy', 'true');
          } else document.body.prepend(notice);
          let next = 0,
            running = false,
            runtimeFailed = false;
          function showFailure(runtime) {
            runtimeFailed ||= runtime;
            message.textContent = runtimeFailed ? copy.reopen : copy.failed;
            retry.textContent = runtimeFailed ? copy.reload : copy.retry;
            retry.disabled = false;
            retry.hidden = false;
            notice.hidden = false;
          }
          function runtimeError(event) {
            if (event.target === window) showFailure(true);
          }
          window.addEventListener('error', runtimeError);
          async function load(source) {
            for (let attempt = 0; attempt < 3; attempt++) {
              if (attempt)
                await new Promise((resolve) => setTimeout(resolve, attempt === 1 ? 250 : 750));
              if (runtimeFailed) throw new Error('Startup execution failed');
              try {
                await new Promise((resolve, reject) => {
                  const script = document.createElement('script');
                  script.async = false;
                  script.onload = () => {
                    script.onload = script.onerror = null;
                    resolve();
                  };
                  script.onerror = () => {
                    script.onload = script.onerror = null;
                    script.remove();
                    reject({ kind: 'network' });
                  };
                  script.src = source;
                  document.head.append(script);
                });
                return;
              } catch (error) {
                if (error.kind !== 'network' || attempt === 2) throw error;
              }
            }
          }
          async function start() {
            if (running || runtimeFailed) return;
            running = true;
            retry.hidden = true;
            retry.disabled = true;
            message.textContent = copy.loading;
            try {
              while (next < sources.length) {
                await load(sources[next]);
                if (runtimeFailed) throw new Error('Startup execution failed');
                next++;
              }
              // Standalone editions finish their inline DOMContentLoaded callbacks first.
              await new Promise((resolve) => setTimeout(resolve, 0));
              if (runtimeFailed) throw new Error('Startup execution failed');
              document.documentElement.dataset.gameReady = 'true';
              if (main) {
                main.inert = false;
                main.removeAttribute('aria-busy');
              }
              notice.hidden = true;
              window.removeEventListener('error', runtimeError);
            } catch (error) {
              showFailure(runtimeFailed || error.kind !== 'network');
            } finally {
              running = false;
              retry.disabled = false;
            }
          }
          retry.addEventListener('click', () => {
            if (runtimeFailed) location.reload();
            else start();
          });
          start();
        }
        if (document.readyState === 'loading')
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        else boot();
      })();
    </script>

  <body>
    <a class="skip-link" href="#main">Skip to game</a>
    <header class="site-header garden-lesson-header">
      <a class="brand" href="index.html#garden-1" aria-label="All gardens"
        ><span class="brand-symbol" aria-hidden="true">✿</span> KojaField</a
      >
      <nav aria-label="Navigation">
        <a class="nav-link field-link" href="index.html#garden-1" aria-label="All gardens"
          >← Gardens</a
        ><button class="nav-link active" id="g1-map">Map</button>
      </nav>
      <div class="header-right">
        <a
          class="garden-wallet-pill"
          href="index.html#garden-1"
          data-garden-wallet="grade1"
          aria-label="Garden shop"
          ><span class="sr-only">Coins for your garden</span><span data-wallet-balance>0</span></a
        >
      </div>
      <label class="language-picker" data-no-translate
        ><span class="sr-only">Language / Nyelv</span
        ><select data-language-switch aria-label="Language / Nyelv">
          <option value="en">EN</option>
          <option value="hu">HU</option>
        </select></label
      >
    </header>
    <main id="main">
      <p class="save-note" id="g1-save-note" role="status" hidden>Cannot save in this browser.</p>
      <section id="g1-map-view">
        <div class="journey-heading">
          <h1>1st Grade</h1>
          <span class="field-count" id="g1-count">0 / 80</span>
        </div>
        <div class="g1-worlds" id="g1-worlds" aria-label="Choose a chapter"></div>
        <section class="g1-world-panel">
          <div class="g1-world-heading">
            <div>
              <span id="g1-world-number" class="g1-kicker"></span>
              <h2 id="g1-world-title"></h2>
            </div>
            <button
              id="g1-review"
              class="g1-review-link"
              aria-label="Practise skills that need another try"
            >
              ↺ <span id="g1-review-count">0</span>
            </button>
          </div>
          <div class="g1-stops" id="g1-stops"></div>
        </section>
      </section>
      <section id="g1-lesson-view" hidden>
        <div class="play-top">
          <button class="back-button" id="g1-back">← Map</button
          ><span class="level-skill lesson-location"
            ><span>Grade 1</span> · <span id="g1-location"></span
          ></span>
        </div>
        <div class="play-heading">
          <h1 id="g1-title"></h1>
        </div>
        <details class="learn-panel g1-learn-panel" id="g1-learn">
          <summary>Show an example</summary>
          <div class="learn-content" id="g1-example"></div>
        </details>
        <div class="g1-missions" id="g1-missions" hidden></div>
        <section id="g1-work" hidden>
          <div class="g1-work-top">
            <button id="g1-fresh" type="button" class="button quiet" hidden>
              ↻ Fresh questions
            </button>
            <div class="g1-flower-summary">
              <div id="g1-flower"></div>
              <output id="g1-score">—</output>
            </div>
          </div>
          <section class="g1-workbook">
            <div class="workbook-heading">
              <p id="g1-instruction"></p>
              <span id="g1-answer-count" class="answer-counter"></span>
            </div>
            <div id="g1-progress-dots" class="g1-progress-dots" aria-hidden="true"></div>
            <h2 id="g1-task-prompt" class="g1-set-prompt" hidden></h2>
            <form id="g1-form" novalidate>
              <div id="g1-questions" class="g1-question-grid"></div>
              <div class="workbook-footer">
                <button id="g1-submit" class="button primary g1-big-action" type="submit"></button>
              </div>
            </form>
            <section id="g1-result" class="g1-result" role="status" hidden>
              <h2 id="g1-result-title"></h2>
              <p id="g1-result-copy"></p>
              <div id="g1-reward" class="garden-reward" hidden></div>
              <div id="g1-targeted" class="g1-targeted"></div>
              <div class="g1-result-actions">
                <button class="button primary" id="g1-next"></button
                ><button class="button quiet" id="g1-result-map">← <span>Map</span></button
                ><button class="button quiet" id="g1-retry-mission" hidden>
                  ↺ <span>Again</span>
                </button>
              </div>
            </section>
          </section>
          <div class="g1-record" id="g1-record"></div>
        </section>
      </section>
    </main>
    <dialog class="info-dialog" id="g1-dialog">
      <button class="icon-button dialog-close" id="g1-close" aria-label="Close">×</button>
      <div id="g1-dialog-copy"></div>
    </dialog>
    <noscript>Enable JavaScript to play.</noscript>
